[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
version = "0.1.0"
description = "FINN ingestion pipeline: archives NSE filings for the daily Brief"
requires-python = ">=3.12"
# Exact pins: this is an app, and these versions are verified on Windows (3.12, 3.15).
dependencies = [
  "requests==2.34.2",
  "lxml==6.1.3",
  "pypdf==6.21.4",
  "fonttools==4.68.0",   # without it pypdf warns on the CFF fonts in many filings
  "anthropic==1.17.0",   # latest 1.x; its API is the documented one (2.x exists, not adopted yet)
  "jsonschema==4.26.0",  # re-validates every model answer locally
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.3",
  # scripts/verify_brief.py: an independent second reading of the PDFs and the rendered page
  "pdfplumber==0.11.10",
  "cssselect==1.6.0",
]

[project.scripts]
finn = "finn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, import order
select = ["E", "F", "W", "B", "I"]
